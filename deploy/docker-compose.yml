# Despliegue del prototipo: docker compose -f deploy/docker-compose.yml up
# Los Dockerfiles viven en backend/docker/ (y frontend/Dockerfile) y asumen el contexto de
# build en la raiz del repo. Copia deploy/.env.example a deploy/.env antes de usar.
#
# `worker-core`/`worker-logs` son reales (docs/09 §16): consumen las colas de Redis
# (`pf:jobs:core`/`pf:jobs:logs`) que `api` llena al crear/reevaluar un assessment o ingerir
# eventos -- esos tres endpoints ya no corren el pipeline dentro del request, devuelven
# `job_id` y el cliente sondea `GET /jobs/{job_id}`.
#
# `api` guarda los archivos subidos en `/app/backend/.data/uploads` (y eventos en
# `.data/events`) para que `reevaluate`/el worker los puedan releer despues (ver UPLOADS_DIR en
# app/api/routes_assessments.py) -- eso solo funciona entre contenedores DISTINTOS si comparten
# el mismo volumen, asi que `backend_data` esta montado en los tres (`api`, `worker-core`,
# `worker-logs`). Sin esto, el job se encola bien pero el worker no encuentra el archivo
# (se detecto real: el primer `docker compose up` de este cambio fallo exactamente asi).
#
# `restart: unless-stopped` en todo lo de larga duracion (no en `migrate`, que es un job de una
# sola corrida y debe terminar, no reiniciarse en loop): sin esto, si `api`/un worker/`frontend`
# se cae (bug, OOM, lo que sea), se queda caido hasta que alguien lo note y lo levante a mano.
# Si un worker se cae a mitad de un job, ese job se queda "en_progreso" para siempre sin esto
# Y sin el reaper de `JOB_STALE_TIMEOUT_SECONDS` (ver backend/.env.example) -- las dos cosas
# juntas son las que realmente cierran el gap: el contenedor vuelve a arrancar solo, y el job
# huerfano que dejo se marca fallido en vez de quedar colgado.
#
# Config de la app: `DEEPSEEK_*`, `AI_MAX_CONCURRENCY`, `CORS_ORIGINS` y
# `JOB_STALE_TIMEOUT_SECONDS` salen de `deploy/.env` via `env_file`, que NO lo pisa el shell. Antes
# iban como `${VAR}` en `environment:` y una variable exportada en el shell (p. ej. la key que usa
# opencode) ganaba sobre el .env -- ver docs/09 §17. `DATABASE_URL`/`REDIS_URL` siguen en
# `environment` porque apuntan a los nombres de servicio de la red de compose, no a un .env de host.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pf}
      POSTGRES_DB: ${POSTGRES_DB:-pf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pf}:${POSTGRES_PASSWORD:-pf}@db:5432/${POSTGRES_DB:-pf}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.api
    restart: unless-stopped
    # deploy/.env es la fuente autoritativa de la config de la app (incluida DEEPSEEK_API_KEY):
    # `env_file` se lee al crear el contenedor y NO lo pisa una variable del shell, a diferencia
    # de `${VAR}` dentro de `environment:` (donde el entorno del shell gana sobre el .env). Por
    # eso la key que usa opencode en el shell puede seguir exportada sin afectar al stack.
    env_file:
      - path: .env
        required: false
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pf}:${POSTGRES_PASSWORD:-pf}@db:5432/${POSTGRES_DB:-pf}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - backend_data:/app/backend/.data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-core:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.worker
    command: ["python", "-m", "app.workers.core"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *backend_env
    volumes:
      - backend_data:/app/backend/.data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-logs:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.worker
    command: ["python", "-m", "app.workers.logs"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *backend_env
    volumes:
      - backend_data:/app/backend/.data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Alcanzable desde el NAVEGADOR del usuario, no desde la red interna de docker-compose
        # -- por eso "localhost:8000" (el puerto publicado de `api`), nunca "http://api:8000".
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  backend_data:
