# Despliegue de referencia del prototipo (objetivo).
# Levanta API, workers, PostgreSQL y Redis con: docker compose -f deploy/docker-compose.yml up
# Los Dockerfiles viven en backend/docker/ y asumen el código en backend/.
# Copia deploy/.env.example a deploy/.env antes de usar.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pf}
      POSTGRES_DB: ${POSTGRES_DB:-pf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pf}:${POSTGRES_PASSWORD:-pf}@db:5432/${POSTGRES_DB:-pf}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pf}:${POSTGRES_PASSWORD:-pf}@db:5432/${POSTGRES_DB:-pf}
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-core:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.worker
    command: ["python", "-m", "app.workers.core"]
    environment: &worker_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pf}:${POSTGRES_PASSWORD:-pf}@db:5432/${POSTGRES_DB:-pf}
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-logs:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.worker
    command: ["python", "-m", "app.workers.logs"]
    environment: *worker_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # frontend (opcional, fuera del foco inicial)
  # frontend:
  #   build: { context: ../frontend }
  #   ports: ["5173:5173"]
  #   depends_on: [api]

volumes:
  pgdata:
  redisdata:
