# Despliegue del prototipo: docker compose -f deploy/docker-compose.yml up
# Los Dockerfiles viven en backend/docker/ y asumen el contexto de build en la raiz del repo.
# Copia deploy/.env.example a deploy/.env antes de usar.
#
# Sin `worker-core`/`worker-logs` todavia (ver docs/09 §15): no existe un `app.workers.*` que
# consuma colas de Redis -- ese modulo nunca se construyo porque todo el pipeline (evaluacion,
# extraccion, ingesta de eventos, motor operativo) corre sincronico dentro de `api` o de la CLI,
# que es exactamente la contingencia que docs/04 §10 y docs/07 §5 ya daban por aceptable sin
# Redis. Redis igual se levanta aqui (sano, con healthcheck) para no reescribir esto cuando
# existan consumidores reales; `api` no lo usa todavia.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pf}
      POSTGRES_DB: ${POSTGRES_DB:-pf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pf}:${POSTGRES_PASSWORD:-pf}@db:5432/${POSTGRES_DB:-pf}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pf}:${POSTGRES_PASSWORD:-pf}@db:5432/${POSTGRES_DB:-pf}
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # frontend (opcional, fuera del foco inicial)
  # frontend:
  #   build: { context: ../frontend }
  #   ports: ["5173:5173"]
  #   depends_on: [api]

volumes:
  pgdata:
  redisdata:
