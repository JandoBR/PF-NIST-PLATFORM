[project]
name = "pf-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "openai>=3.22.1",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-hcl2>=8.1.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
