[project]
name = "pf-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "jsonschema>=4.26.0",
    "openai>=3.22.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-hcl2>=8.1.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
