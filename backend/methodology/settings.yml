# Parametros de metodologia versionada (docs/04 §8). Fuente canonica de los umbrales de Tier;
# las tablas en docs/01 §8.2 y docs/03 §9 son copias ilustrativas de este archivo.
version: 1
ia:
  alpha: 0.25
  divergencia_maxima: 20
  umbral_confianza_documental: 0.6
tier:
  t2: { CRI-GV-01: 50, CRI-GV-02: 50, CRI-ID-03: 50 }
  t3:
    CRI-GV-01: 75
    CRI-GV-03: 75
    CRI-GV-04: 75
    CRI-DE-01: 75
    CRI-RS-01: 75
    CRI-RC-01: 75
    CRI-RC-02: 75
  t4: { CRI-GV-04: 100, CRI-RS-02: 75, CRI-RC-03: 75, CRI-ID-04: 75 }
funciones: { GV: 1, ID: 1, PR: 1, DE: 1, RS: 1, RC: 1 }
cobertura:
  # Cobertura (criterios con evidencia suficiente / aplicables) bajo la cual el puntaje se marca
  # provisional (docs/01 §7).
  umbral_provisional: 0.5
planes:
  # Un criterio con final_score por debajo de esto genera un hallazgo/plan (docs/05 §4).
  umbral_brecha: 75
vigilancia:
  # Umbrales de disparadores operativos (docs/08 §5): N, W y plazos son metodologia, no modelo.
  auth_failures_burst: { n: 5, ventana_minutos: 5 }
  plazo_escalamiento_minutos: 30
  # Patrones nuevos que debe agregar una ingesta para reevaluar la madurez del org+scope
  # automaticamente (docs/06 §6, docs/08 §8). Reingerir el mismo log no suma y no dispara.
  refresco_min_patrones_nuevos: 3
