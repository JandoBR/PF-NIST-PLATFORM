# Catalogo de criterios (docs/03-matriz-de-criterios.md): los criterios PROTECT que Terraform
# evalua por si solo, CRI-GV-01 (puramente documental, ejercita U1) y CRI-PR-04 (puramente
# Ansible). CRI-PR-06 combina Terraform + Ansible en un mismo criterio Mixto. CRI-DE-02/RS-01/
# RC-02/RC-03 son Mixto pero simplificados a solo `log.pattern` (docs/06): sin doc.claim todavia,
# el tope sin evidencia documental es 75, igual que CRI-PR-02 sin politica.
# Ampliar este archivo y agregar su modulo en app/evaluation/rules van siempre juntos (D5).
# v2: CR-01 agrega los 7 criterios MVP que faltaban (GV-02/03, ID-01/02/03, DE-01, RC-01).
# v3: CR-02/CR-03 agregan el resto salvo DE-03 (GV-04, ID-04, RS-02, RS-03).
# v4: DE-03 cierra el catalogo (23/23) y DE-02 incorpora doc.claim (CR-04).
# v5: PR-02, RS-01, RC-02 y RC-03 consumen doc.claim (CR-05).
# v6: CR-06 - PR-01/02/03/04/05/06 y DE-01 consumen la evidencia declarada que ignoraban y
#     declaran las expresiones Terraform sin resolver (tf.expression.unresolved).
# v7: PR-05 consume tf.db_exposure.config y pide exposure_policy (contradiccion docs/02 §5).
# v8: los criterios documentales leen doc.claim@2 (cita verificada); silencio documental ->
#     evidencia_insuficiente; GV-04 y DE-02 cambian tramos (docs/09 §60).
# v9: todo puntaje 0 sale con estado no_implementado (la IA no puede subirlo, J2); RC-03 exige
#     destinatarios en la lista de notificacion (docs/09 §63).
# v10: PR-02 puntua la retencion menor que la politica (50) en vez de ignorar la politica; RC-03
#      exige comunicacion observada para el 100; DE-01 centralizacion = multirregion; PR-03 es
#      insuficiente con CIDR/puerto sin resolver (docs/09 §64).
# v11: PR-01/02/03/04 dan 0 ante una ausencia explicita total (antes su piso era 25 y nunca
#      llegaban a severidad alta); PR-05 exige bloque en todos los buckets; ID-01 no cuenta
#      recursos de configuracion (docs/09 §65).
# v12: Oleada 0 - GV-04, ID-03 y RS-02 declaran las subcategorias que sus propias anclas ya
#      evidencian (GV.OV-02, ID.RA-03/06, RS.AN-06). Sin cambios de regla: solo el mapeo
#      (docs/09 §70).
# v13: Oleada A (1/2) - CRI-RS-04 (contencion/erradicacion, RS.MI) consume el patron
#      containment_done que no tenia consumidor, y CRI-ID-05 (mejora continua, ID.IM) suma el
#      ejercicio observado a lo documental (docs/09 §72).
# v14: Oleada A (2/2) - CRI-GV-05 (GV.OC), CRI-GV-06 (GV.SC) y CRI-PR-07 (PR.AT) con tres tipos de
#      afirmacion nuevos (org_context, supplier_program, training_program). 22/22 categorias
#      (docs/09 §73).
# v15: Oleada B (1/4) - todos los criterios operativos pasan a log.pattern@2 (que conserva los
#      origenes del patron) y CRI-DE-02 declara DE.AE-03: el 100 exige correlacion desde dos
#      fuentes distintas (docs/09 §75, cierra SUB-02 de docs/12 §5).
# v16: Oleada B (2/4) - ID-03 declara ID.RA-04, RS-01 declara RS.MA-05 e ID-05 declara ID.IM-04,
#      con cuatro campos nuevos de `process_defined` (prompt extract_v3). Cierra SUB-01 y SUB-03
#      de docs/12 §5 (docs/09 §76).
# v17: Oleada B (3/4) - la funcion Gobernar queda completa (31/31): GV-02 declara GV.RR-03/04,
#      GV-03 las siete de GV.RM y GV-06 las diez de GV.SC, con una faceta de afirmacion por
#      subcategoria y anclas de amplitud (prompt extract_v4, docs/09 §77).
# v18: Oleada B (4/4) - GV-02, GV-03 y GV-06 ajustan titulo y recomendacion a lo que ahora cubren:
#      categorias enteras, no los dos o tres resultados con que entraron (docs/09 §78).
# v19: GV-02 exige responsable nombrado, responsabilidades y autoridad; RS-03 exige criterios y
#      plazos; RS-01 exige escalamiento posterior; PR-01 exige evidencia de cifrado por recurso;
#      PR-04 no da 100 con un modo relativo; PR-05 no da 100 con bloqueo sin resolver
#      (docs/09 §79-88).
# v20: Oleada C (1/5) - CRI-ID-06 declara ID.RA-09 con los dos tipos de procedencia que el
#      adaptador de Terraform ahora lee (`tf.module.source`, `tf.provider.version`). Primera
#      subcategoria de la cobertura que no depende de que U1 extraiga nada (docs/09 §90).
# v21: Oleada C (2/5) - CRI-PR-08 (identidades y autenticacion) declara PR.AA-01 y PR.AA-03 con
#      `tf.identity.config` y la presencia de recursos IAM (docs/09 §91).
# v22: Oleada C (3/5) - CRI-PR-09 (resiliencia y capacidad) declara PR.IR-03 y PR.IR-04 desde
#      `multi_az`/`replicate_source_db` y los grupos de autoescalado (docs/09 §92).
version: 22
criterios:
  - id: CRI-GV-01
    version: 1
    titulo: "Politica de ciberseguridad establecida y revisada"
    tipo: proceso
    funcion: GV
    categorias: [GV.PO]
    subcategorias: [GV.PO-01, GV.PO-02]
    peso: 5
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Formalizar/aprobar la politica; definir ciclo de revision y registrar la ultima revision."
    regla:
      tipo: politica_documental
      tipos_afirmacion: [policy_exists, policy_review]

  - id: CRI-GV-02
    version: 2
    titulo: "Roles y responsabilidades definidos"
    tipo: proceso
    funcion: GV
    categorias: [GV.RR]
    subcategorias: [GV.RR-01, GV.RR-02, GV.RR-03, GV.RR-04]
    peso: 5
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Designar responsable de seguridad y duenos de activos con autoridad explicita, asignarles recursos acordes a la estrategia de riesgo e incorporar la ciberseguridad a las practicas de personal."
    regla:
      tipo: roles_documental
      tipos_afirmacion: [role_assigned]

  - id: CRI-GV-03
    version: 2
    titulo: "Estrategia de gestion del riesgo"
    tipo: proceso
    funcion: GV
    categorias: [GV.RM]
    subcategorias: [GV.RM-01, GV.RM-02, GV.RM-03, GV.RM-04, GV.RM-05, GV.RM-06, GV.RM-07]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Desarrollar la estrategia de riesgo: objetivos y tolerancia, un metodo unico de calculo y priorizacion, las opciones de respuesta admitidas y las lineas de comunicacion del riesgo."
    regla:
      tipo: tolerancia_documental
      tipos_afirmacion: [risk_tolerance]

  - id: CRI-GV-04
    version: 1
    titulo: "Revision del desempeno y mejora de la estrategia"
    tipo: proceso
    funcion: GV
    categorias: [GV.OV]
    subcategorias: [GV.OV-01, GV.OV-02, GV.OV-03]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Institucionalizar una revision periodica de la estrategia basada en resultados y registrar los ajustes."
    regla:
      tipo: revision_documental
      tipos_afirmacion: [policy_review, process_defined]

  - id: CRI-GV-05
    version: 1
    titulo: "Contexto organizacional declarado"
    tipo: proceso
    funcion: GV
    categorias: [GV.OC]
    subcategorias: [GV.OC-01, GV.OC-02, GV.OC-03, GV.OC-04, GV.OC-05]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Declarar mision, partes interesadas, requisitos legales (incluida privacidad), servicios criticos y dependencias externas como entrada de la gestion del riesgo."
    regla:
      tipo: contexto_organizacional
      tipos_afirmacion: [org_context]

  - id: CRI-GV-06
    version: 2
    titulo: "Programa de riesgo de la cadena de suministro"
    tipo: proceso
    funcion: GV
    categorias: [GV.SC]
    subcategorias: [GV.SC-01, GV.SC-02, GV.SC-03, GV.SC-04, GV.SC-05, GV.SC-06, GV.SC-07, GV.SC-08,
                     GV.SC-09, GV.SC-10]
    peso: 2
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Formalizar el programa de proveedores: roles acordados, inventario priorizado, requisitos en contratos, debida diligencia previa, seguimiento del riesgo durante la relacion y disposiciones de cierre."
    regla:
      tipo: cadena_de_suministro
      tipos_afirmacion: [supplier_program]

  - id: CRI-ID-01
    version: 1
    titulo: "Inventario de activos"
    tipo: mixto
    funcion: ID
    categorias: [ID.AM]
    subcategorias: [ID.AM-01, ID.AM-02]
    peso: 4
    ai_adjustable: false
    evidencias: [tf.resource.present@1, doc.claim@2]
    recomendacion: "Mantener un inventario de activos que incluya los recursos desplegados y su responsable."
    regla:
      tipo: inventario_documental
      tipos_afirmacion: [data_inventory]

  - id: CRI-ID-02
    version: 1
    titulo: "Priorizacion de activos por criticidad"
    tipo: proceso
    funcion: ID
    categorias: [ID.AM]
    subcategorias: [ID.AM-05]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Clasificar activos por criticidad y usarlo para priorizar controles y esfuerzo."
    regla:
      tipo: criticidad_documental
      tipos_afirmacion: [data_inventory]

  - id: CRI-ID-03
    version: 2
    titulo: "Identificacion y evaluacion de riesgos"
    tipo: proceso
    funcion: ID
    categorias: [ID.RA]
    subcategorias: [ID.RA-01, ID.RA-03, ID.RA-04, ID.RA-05, ID.RA-06]
    peso: 4
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Establecer una evaluacion de riesgos repetible con registro y priorizacion."
    regla:
      tipo: proceso_riesgos
      tipos_afirmacion: [process_defined]

  - id: CRI-ID-04
    version: 1
    titulo: "Inventario de datos y metadatos"
    tipo: proceso
    funcion: ID
    categorias: [ID.AM]
    subcategorias: [ID.AM-07]
    peso: 2
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Documentar que datos existen, donde residen y su clasificacion, incluyendo datos personales."
    regla:
      tipo: inventario_datos
      tipos_afirmacion: [data_inventory]

  - id: CRI-ID-05
    version: 2
    titulo: "Mejora continua a partir de evaluaciones y ejercicios"
    tipo: mixto
    funcion: ID
    categorias: [ID.IM]
    subcategorias: [ID.IM-01, ID.IM-02, ID.IM-03, ID.IM-04]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2, log.pattern@2, log.window@1]
    recomendacion: "Cerrar el ciclo de mejora: registrar las lecciones de evaluaciones y ejercicios y seguir los ajustes con metricas."
    regla:
      tipo: mejora_continua
      patrones_positivos: [restore_exercise_run]
      tipos_afirmacion: [process_defined]

  - id: CRI-ID-06
    version: 1
    titulo: "Procedencia e integridad del software adquirido"
    tipo: tecnico
    funcion: ID
    categorias: [ID.RA]
    subcategorias: [ID.RA-09]
    peso: 2
    ai_adjustable: false
    evidencias: [tf.module.source@1, tf.provider.version@1]
    recomendacion: "Fijar la procedencia del codigo de terceros: `version` en cada modulo del registry, `?ref=<tag|sha>` en los de git, y una restriccion de version por proveedor en `required_providers`."
    regla:
      tipo: procedencia_del_codigo

  - id: CRI-PR-01
    version: 1
    titulo: "Cifrado de datos en reposo"
    tipo: tecnico
    funcion: PR
    categorias: [PR.DS]
    subcategorias: [PR.DS-01]
    peso: 5
    ai_adjustable: true
    evidencias: [tf.encryption.config@1, doc.claim@2]
    recomendacion: "Habilitar cifrado gestionado por KMS en RDS y S3; verificar mecanismo y llave."
    regla:
      tipo: umbral_por_recurso
      estados: { all_enabled: 100, any_disabled: 25, any_unknown: insuficiente }
      tipos_afirmacion: [policy_exists]

  - id: CRI-PR-08
    version: 1
    titulo: "Gestion de identidades y autenticacion"
    tipo: tecnico
    funcion: PR
    categorias: [PR.AA]
    subcategorias: [PR.AA-01, PR.AA-03]
    peso: 5
    ai_adjustable: false
    evidencias: [tf.identity.config@1, tf.resource.present@1]
    recomendacion: "Declarar las identidades en IaC y endurecer la autenticacion: politica de contrasenas de al menos 14 caracteres (CIS AWS) y una politica que exija `aws:MultiFactorAuthPresent`."
    regla:
      tipo: identidades_y_autenticacion

  - id: CRI-PR-09
    version: 1
    titulo: "Resiliencia y capacidad de la plataforma"
    tipo: tecnico
    funcion: PR
    categorias: [PR.IR]
    subcategorias: [PR.IR-03, PR.IR-04]
    peso: 3
    ai_adjustable: false
    evidencias: [tf.resilience.config@1]
    recomendacion: "Declarar alta disponibilidad (`multi_az` o una replica de lectura) y capacidad elastica (un grupo de autoescalado con `max_size` mayor que `min_size`)."
    regla:
      tipo: resiliencia_y_capacidad

  - id: CRI-PR-02
    version: 1
    titulo: "Backups configurados y protegidos"
    tipo: tecnico
    funcion: PR
    categorias: [PR.DS]
    subcategorias: [PR.DS-11]
    peso: 5
    ai_adjustable: true
    evidencias: [tf.backup.config@1, doc.claim@2]
    recomendacion: "Alinear retencion de backups con la politica y asegurar su cifrado."
    regla:
      tipo: umbral_retencion
      umbrales: { retencion_minima_dias: 7 }
      tipos_afirmacion: [backup_policy]

  - id: CRI-PR-03
    version: 1
    titulo: "Acceso administrativo restringido"
    tipo: tecnico
    funcion: PR
    categorias: [PR.AA, PR.IR]
    subcategorias: [PR.AA-05, PR.IR-01]
    peso: 4
    ai_adjustable: false
    evidencias: [tf.security_group.rules@1]
    recomendacion: "Restringir puertos administrativos a rangos corporativos/VPN y eliminar reglas 0.0.0.0/0."
    regla:
      tipo: exposicion_puertos
      puertos_administrativos: [22, 3389]

  - id: CRI-PR-04
    version: 1
    titulo: "Configuracion segura del servidor (SSH)"
    tipo: tecnico
    funcion: PR
    categorias: [PR.PS]
    subcategorias: [PR.PS-01]
    peso: 3
    ai_adjustable: false
    evidencias: [an.task.config@1, an.file.permissions@1]
    recomendacion: "Deshabilitar login de root y autenticacion por contrasena; usar claves."
    regla:
      tipo: sshd_directivas
      directivas: [PermitRootLogin, PasswordAuthentication]

  - id: CRI-PR-05
    version: 1
    titulo: "Almacenamiento protegido contra acceso publico"
    tipo: tecnico
    funcion: PR
    categorias: [PR.DS]
    subcategorias: [PR.DS-01]
    peso: 3
    ai_adjustable: false
    evidencias: [tf.public_access.config@1, tf.versioning.config@1, tf.db_exposure.config@1]
    recomendacion: "Habilitar aws_s3_bucket_public_access_block completo."
    regla:
      tipo: bloqueo_publico_4_modos
      tipos_afirmacion: [exposure_policy]

  - id: CRI-PR-06
    version: 1
    titulo: "Generacion de logs para monitoreo"
    tipo: tecnico
    funcion: PR
    categorias: [PR.PS]
    subcategorias: [PR.PS-04]
    peso: 4
    ai_adjustable: false
    evidencias: [tf.logging.config@1, an.service.state@1]
    recomendacion: "Habilitar CloudTrail multirregion y logging de sistema con retencion definida."
    regla:
      tipo: cloudtrail_multiregion

  - id: CRI-PR-07
    version: 1
    titulo: "Concienciacion y formacion en seguridad"
    tipo: proceso
    funcion: PR
    categorias: [PR.AT]
    subcategorias: [PR.AT-01, PR.AT-02]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Formalizar un programa de concienciacion con periodicidad declarada y formacion especifica para los roles con acceso privilegiado."
    regla:
      tipo: formacion
      tipos_afirmacion: [training_program]

  - id: CRI-DE-01
    version: 1
    titulo: "Monitoreo de red y computo"
    tipo: mixto
    funcion: DE
    categorias: [DE.CM]
    subcategorias: [DE.CM-01, DE.CM-09]
    peso: 5
    ai_adjustable: false
    evidencias: [tf.logging.config@1, an.service.state@1, log.window@1]
    recomendacion: "Centralizar logs y definir fuentes minimas de monitoreo (red, sistema, nube)."
    regla:
      tipo: monitoreo
      tipos_afirmacion: []

  - id: CRI-DE-02
    version: 2
    titulo: "Analisis de eventos y declaracion de incidentes"
    tipo: mixto
    funcion: DE
    categorias: [DE.AE]
    subcategorias: [DE.AE-02, DE.AE-03, DE.AE-08]
    peso: 4
    ai_adjustable: true
    evidencias: [log.pattern@2, log.window@1, doc.claim@2]
    recomendacion: "Definir criterios de declaracion de incidentes y registrar alertas con su analisis."
    regla:
      tipo: patron_con_justicia
      patrones_positivos: [alert_raised, incident_declared]
      patron_oportunidad: auth_failures_burst
      tipos_afirmacion: [process_defined]

  - id: CRI-DE-03
    version: 1
    titulo: "Informacion de eventos a personal y herramientas"
    tipo: mixto
    funcion: DE
    categorias: [DE.AE]
    subcategorias: [DE.AE-06]
    peso: 3
    ai_adjustable: true
    evidencias: [log.pattern@2, doc.claim@2]
    recomendacion: "Definir destinatarios de alertas y verificar la entrega."
    regla:
      tipo: notificacion_eventos
      tipos_afirmacion: [notification_list]

  - id: CRI-RS-01
