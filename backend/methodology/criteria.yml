# Catalogo de criterios (docs/03-matriz-de-criterios.md): los criterios PROTECT que Terraform
# evalua por si solo, CRI-GV-01 (puramente documental, ejercita U1) y CRI-PR-04 (puramente
# Ansible). CRI-PR-06 combina Terraform + Ansible en un mismo criterio Mixto. CRI-DE-02/RS-01/
# RC-02/RC-03 son Mixto pero simplificados a solo `log.pattern` (docs/06): sin doc.claim todavia,
# el tope sin evidencia documental es 75, igual que CRI-PR-02 sin politica.
# Ampliar este archivo y agregar su modulo en app/evaluation/rules van siempre juntos (D5).
# v2: CR-01 agrega los 7 criterios MVP que faltaban (GV-02/03, ID-01/02/03, DE-01, RC-01).
# v3: CR-02/CR-03 agregan el resto salvo DE-03 (GV-04, ID-04, RS-02, RS-03).
# v4: DE-03 cierra el catalogo (23/23) y DE-02 incorpora doc.claim (CR-04).
# v5: PR-02, RS-01, RC-02 y RC-03 consumen doc.claim (CR-05).
# v6: CR-06 - PR-01/02/03/04/05/06 y DE-01 consumen la evidencia declarada que ignoraban y
#     declaran las expresiones Terraform sin resolver (tf.expression.unresolved).
# v7: PR-05 consume tf.db_exposure.config y pide exposure_policy (contradiccion docs/02 §5).
# v8: los criterios documentales leen doc.claim@2 (cita verificada); silencio documental ->
#     evidencia_insuficiente; GV-04 y DE-02 cambian tramos (docs/09 §60).
# v9: todo puntaje 0 sale con estado no_implementado (la IA no puede subirlo, J2); RC-03 exige
#     destinatarios en la lista de notificacion (docs/09 §63).
# v10: PR-02 puntua la retencion menor que la politica (50) en vez de ignorar la politica; RC-03
#      exige comunicacion observada para el 100; DE-01 centralizacion = multirregion; PR-03 es
#      insuficiente con CIDR/puerto sin resolver (docs/09 §64).
# v11: PR-01/02/03/04 dan 0 ante una ausencia explicita total (antes su piso era 25 y nunca
#      llegaban a severidad alta); PR-05 exige bloque en todos los buckets; ID-01 no cuenta
#      recursos de configuracion (docs/09 §65).
version: 11
criterios:
  - id: CRI-GV-01
    version: 1
    titulo: "Politica de ciberseguridad establecida y revisada"
    tipo: proceso
    funcion: GV
    categorias: [GV.PO]
    subcategorias: [GV.PO-01, GV.PO-02]
    peso: 5
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Formalizar/aprobar la politica; definir ciclo de revision y registrar la ultima revision."
    regla:
      tipo: politica_documental
      tipos_afirmacion: [policy_exists, policy_review]

  - id: CRI-GV-02
    version: 1
    titulo: "Roles y responsabilidades definidos"
    tipo: proceso
    funcion: GV
    categorias: [GV.RR]
    subcategorias: [GV.RR-01, GV.RR-02]
    peso: 5
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Designar responsable de seguridad y duenos de activos con responsabilidades y autoridad explicitas."
    regla:
      tipo: roles_documental
      tipos_afirmacion: [role_assigned]

  - id: CRI-GV-03
    version: 1
    titulo: "Objetivos de riesgo y tolerancia establecidos"
    tipo: proceso
    funcion: GV
    categorias: [GV.RM]
    subcategorias: [GV.RM-01, GV.RM-02]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Documentar objetivos de riesgo y una declaracion de tolerancia usada en decisiones operativas."
    regla:
      tipo: tolerancia_documental
      tipos_afirmacion: [risk_tolerance]

  - id: CRI-GV-04
    version: 1
    titulo: "Revision del desempeno y mejora de la estrategia"
    tipo: proceso
    funcion: GV
    categorias: [GV.OV]
    subcategorias: [GV.OV-01, GV.OV-03]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Institucionalizar una revision periodica de la estrategia basada en resultados y registrar los ajustes."
    regla:
      tipo: revision_documental
      tipos_afirmacion: [policy_review, process_defined]

  - id: CRI-ID-01
    version: 1
    titulo: "Inventario de activos"
    tipo: mixto
    funcion: ID
    categorias: [ID.AM]
    subcategorias: [ID.AM-01, ID.AM-02]
    peso: 4
    ai_adjustable: false
    evidencias: [tf.resource.present@1, doc.claim@2]
    recomendacion: "Mantener un inventario de activos que incluya los recursos desplegados y su responsable."
    regla:
      tipo: inventario_documental
      tipos_afirmacion: [data_inventory]

  - id: CRI-ID-02
    version: 1
    titulo: "Priorizacion de activos por criticidad"
    tipo: proceso
    funcion: ID
    categorias: [ID.AM]
    subcategorias: [ID.AM-05]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Clasificar activos por criticidad y usarlo para priorizar controles y esfuerzo."
    regla:
      tipo: criticidad_documental
      tipos_afirmacion: [data_inventory]

  - id: CRI-ID-03
    version: 1
    titulo: "Identificacion y evaluacion de riesgos"
    tipo: proceso
    funcion: ID
    categorias: [ID.RA]
    subcategorias: [ID.RA-01, ID.RA-05]
    peso: 4
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Establecer una evaluacion de riesgos repetible con registro y priorizacion."
    regla:
      tipo: proceso_riesgos
      tipos_afirmacion: [process_defined]

  - id: CRI-ID-04
    version: 1
    titulo: "Inventario de datos y metadatos"
    tipo: proceso
    funcion: ID
    categorias: [ID.AM]
    subcategorias: [ID.AM-07]
    peso: 2
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Documentar que datos existen, donde residen y su clasificacion, incluyendo datos personales."
    regla:
      tipo: inventario_datos
      tipos_afirmacion: [data_inventory]

  - id: CRI-PR-01
    version: 1
    titulo: "Cifrado de datos en reposo"
    tipo: tecnico
    funcion: PR
    categorias: [PR.DS]
    subcategorias: [PR.DS-01]
    peso: 5
    ai_adjustable: true
    evidencias: [tf.encryption.config@1, doc.claim@2]
    recomendacion: "Habilitar cifrado gestionado por KMS en RDS y S3; verificar mecanismo y llave."
    regla:
      tipo: umbral_por_recurso
      estados: { all_enabled: 100, any_disabled: 25, any_unknown: insuficiente }
      tipos_afirmacion: [policy_exists]

  - id: CRI-PR-02
    version: 1
    titulo: "Backups configurados y protegidos"
    tipo: tecnico
    funcion: PR
    categorias: [PR.DS]
    subcategorias: [PR.DS-11]
    peso: 5
    ai_adjustable: true
    evidencias: [tf.backup.config@1, doc.claim@2]
    recomendacion: "Alinear retencion de backups con la politica y asegurar su cifrado."
    regla:
      tipo: umbral_retencion
      umbrales: { retencion_minima_dias: 7 }
      tipos_afirmacion: [backup_policy]

  - id: CRI-PR-03
    version: 1
    titulo: "Acceso administrativo restringido"
    tipo: tecnico
    funcion: PR
    categorias: [PR.AA, PR.IR]
    subcategorias: [PR.AA-05, PR.IR-01]
    peso: 4
    ai_adjustable: false
    evidencias: [tf.security_group.rules@1]
    recomendacion: "Restringir puertos administrativos a rangos corporativos/VPN y eliminar reglas 0.0.0.0/0."
    regla:
      tipo: exposicion_puertos
      puertos_administrativos: [22, 3389]

  - id: CRI-PR-04
    version: 1
    titulo: "Configuracion segura del servidor (SSH)"
    tipo: tecnico
    funcion: PR
    categorias: [PR.PS]
    subcategorias: [PR.PS-01]
    peso: 3
    ai_adjustable: false
    evidencias: [an.task.config@1, an.file.permissions@1]
    recomendacion: "Deshabilitar login de root y autenticacion por contrasena; usar claves."
    regla:
      tipo: sshd_directivas
      directivas: [PermitRootLogin, PasswordAuthentication]

  - id: CRI-PR-05
    version: 1
    titulo: "Almacenamiento protegido contra acceso publico"
    tipo: tecnico
    funcion: PR
    categorias: [PR.DS]
    subcategorias: [PR.DS-01]
    peso: 3
    ai_adjustable: false
    evidencias: [tf.public_access.config@1, tf.versioning.config@1, tf.db_exposure.config@1]
    recomendacion: "Habilitar aws_s3_bucket_public_access_block completo."
    regla:
      tipo: bloqueo_publico_4_modos
      tipos_afirmacion: [exposure_policy]

  - id: CRI-PR-06
    version: 1
    titulo: "Generacion de logs para monitoreo"
    tipo: tecnico
    funcion: PR
    categorias: [PR.PS]
    subcategorias: [PR.PS-04]
    peso: 4
    ai_adjustable: false
    evidencias: [tf.logging.config@1, an.service.state@1]
    recomendacion: "Habilitar CloudTrail multirregion y logging de sistema con retencion definida."
    regla:
      tipo: cloudtrail_multiregion

  - id: CRI-DE-01
    version: 1
    titulo: "Monitoreo de red y computo"
    tipo: mixto
    funcion: DE
    categorias: [DE.CM]
    subcategorias: [DE.CM-01, DE.CM-09]
    peso: 5
    ai_adjustable: false
    evidencias: [tf.logging.config@1, an.service.state@1, log.window@1]
    recomendacion: "Centralizar logs y definir fuentes minimas de monitoreo (red, sistema, nube)."
    regla:
      tipo: monitoreo
      tipos_afirmacion: []

  - id: CRI-DE-02
    version: 1
    titulo: "Analisis de eventos y declaracion de incidentes"
    tipo: mixto
    funcion: DE
    categorias: [DE.AE]
    subcategorias: [DE.AE-02, DE.AE-08]
    peso: 4
    ai_adjustable: true
    evidencias: [log.pattern@1, log.window@1, doc.claim@2]
    recomendacion: "Definir criterios de declaracion de incidentes y registrar alertas con su analisis."
    regla:
      tipo: patron_con_justicia
      patrones_positivos: [alert_raised, incident_declared]
      patron_oportunidad: auth_failures_burst
      tipos_afirmacion: [process_defined]

  - id: CRI-DE-03
    version: 1
    titulo: "Informacion de eventos a personal y herramientas"
    tipo: mixto
    funcion: DE
    categorias: [DE.AE]
    subcategorias: [DE.AE-06]
    peso: 3
    ai_adjustable: true
    evidencias: [log.pattern@1, doc.claim@2]
    recomendacion: "Definir destinatarios de alertas y verificar la entrega."
    regla:
      tipo: notificacion_eventos
      tipos_afirmacion: [notification_list]

  - id: CRI-RS-01
    version: 1
    titulo: "Plan de respuesta con clasificacion y escalamiento"
    tipo: mixto
    funcion: RS
    categorias: [RS.MA]
    subcategorias: [RS.MA-01, RS.MA-02, RS.MA-03, RS.MA-04]
    peso: 5
    ai_adjustable: true
    evidencias: [log.pattern@1, log.window@1, doc.claim@2]
    recomendacion: "Documentar y ensayar el plan de respuesta incluyendo escalamiento y criterios de prioridad."
    regla:
      tipo: patron_con_justicia
      patrones_positivos: [escalation_done]
      patron_oportunidad: incident_declared
      tipos_afirmacion: [process_defined, escalation_path]

  - id: CRI-RS-02
    version: 1
    titulo: "Analisis de incidentes y preservacion de evidencia"
    tipo: mixto
    funcion: RS
    categorias: [RS.AN]
    subcategorias: [RS.AN-03, RS.AN-07]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2, log.pattern@1]
    recomendacion: "Definir analisis de causa raiz y preservacion de evidencia con registros."
    regla:
      tipo: analisis_incidentes
      tipos_afirmacion: [process_defined]

  - id: CRI-RS-03
    version: 1
    titulo: "Notificacion a partes interesadas"
    tipo: proceso
    funcion: RS
    categorias: [RS.CO]
    subcategorias: [RS.CO-02]
    peso: 3
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Definir a quien, cuando y como se notifica un incidente."
    regla:
      tipo: notificacion
      tipos_afirmacion: [notification_list]

  - id: CRI-RC-01
    version: 1
    titulo: "Procedimiento de recuperacion definido y ejecutable"
    tipo: proceso
    funcion: RC
    categorias: [RC.RP]
    subcategorias: [RC.RP-01, RC.RP-02]
    peso: 5
    ai_adjustable: true
    evidencias: [doc.claim@2]
    recomendacion: "Documentar el procedimiento de recuperacion con responsables y criterios de inicio."
    regla:
      tipo: procedimiento_recuperacion
      tipos_afirmacion: [process_defined, backup_policy]

  - id: CRI-RC-02
    version: 1
    titulo: "Verificacion de integridad de backups"
    tipo: mixto
    funcion: RC
    categorias: [RC.RP]
    subcategorias: [RC.RP-03]
    peso: 4
    ai_adjustable: true
    evidencias: [log.pattern@1, log.window@1, doc.claim@2]
    recomendacion: "Verificar integridad de backups antes de restaurar y registrar la prueba."
    regla:
      tipo: restauracion_verificada
      tipos_afirmacion: [backup_policy]

  - id: CRI-RC-03
    version: 1
    titulo: "Restauracion verificada y comunicacion de recuperacion"
    tipo: mixto
    funcion: RC
    categorias: [RC.RP, RC.CO]
    subcategorias: [RC.RP-05, RC.CO-03]
    peso: 3
    ai_adjustable: true
    evidencias: [log.pattern@1, log.window@1, doc.claim@2]
    recomendacion: "Confirmar operacion normal tras restaurar y comunicar el estado a los interesados."
    regla:
      tipo: comunicacion_recuperacion
      tipos_afirmacion: [notification_list]
