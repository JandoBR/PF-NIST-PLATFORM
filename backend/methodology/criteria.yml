    regla:
      tipo: restauracion_verificada
      tipos_afirmacion: [backup_policy]

  - id: CRI-RC-03
    version: 1
    titulo: "Restauracion verificada y comunicacion de recuperacion"
    tipo: mixto
    funcion: RC
    categorias: [RC.RP, RC.CO]
    subcategorias: [RC.RP-05, RC.CO-03]
    peso: 3
    ai_adjustable: true
    evidencias: [log.pattern@2, log.window@1, doc.claim@2]
    recomendacion: "Confirmar operacion normal tras restaurar y comunicar el estado a los interesados."
    regla:
      tipo: comunicacion_recuperacion
      tipos_afirmacion: [notification_list]
