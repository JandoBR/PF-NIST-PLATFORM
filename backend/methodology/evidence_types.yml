# Tipos de evidencia (docs/02-catalogo-de-evidencias.md). Una version publicada no se modifica jamas.
# v2: tf.db_exposure.config (accesibilidad publica de bases de datos, docs/02 §5).
# v3: doc.source.info (documento analizado, docs/05 §2.3 E6).
version: 3
tipos:
  - id: tf.resource.present
    version: 1
    descripcion: >
      Inventario y existencia de un recurso de Terraform soportado por el adaptador.
    valor_schema:
      type: object
      required: [tipo, nombre]
      properties:
        tipo: { type: string }
        nombre: { type: string }
        entorno: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.encryption.config
    version: 1
    descripcion: >
      Configuracion de cifrado en reposo declarada para un recurso de almacenamiento o base de datos.
    valor_schema:
      type: object
      required: [estado]
      properties:
        estado: { enum: [enabled, disabled, unknown] }
        mecanismo: { type: [string, "null"] }
        llave: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"
    notas: >
      `unknown` nunca equivale a `disabled` ni a `enabled`; alimenta evidencia_insuficiente.

  - id: tf.public_access.config
    version: 1
    descripcion: >
      Bloqueo de acceso publico declarado para un bucket de almacenamiento (4 modos de S3).
    valor_schema:
      type: object
      required: [bloqueo_publico]
      properties:
        bloqueo_publico: { enum: [true, false, "unknown"] }
        nivel: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.db_exposure.config
    version: 1
    descripcion: >
      Accesibilidad publica declarada de una base de datos administrada (`publicly_accessible`).
    valor_schema:
      type: object
      required: [publico]
      properties:
        publico: { enum: [true, false, "unknown"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-10-02"
    notas: >
      Atributo ausente o expresion sin resolver => `unknown`; nunca se asume el default del
      proveedor (docs/02 §4).

  - id: tf.backup.config
    version: 1
    descripcion: >
      Retencion de backups declarada para una base de datos administrada.
    valor_schema:
      type: object
      properties:
        retencion_dias: { type: [integer, "null"] }
        habilitado: { type: [boolean, "null"] }
        ventana: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.logging.config
    version: 1
    descripcion: >
      Configuracion de CloudTrail declarada (habilitado, multi-region, destino).
    valor_schema:
      type: object
      properties:
        habilitado: { enum: [true, false, "unknown"] }
        multi_region: { type: [boolean, "null"] }
        destino: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.security_group.rules
    version: 1
    descripcion: >
      Reglas de ingress/egress declaradas en un security group, normalizadas por protocolo,
      rango de puertos y CIDR de origen/destino.
    valor_schema:
      type: array
      items:
        type: object
        required: [direccion, protocolo, puerto_desde, puerto_hasta, cidr]
        properties:
          direccion: { enum: [ingress, egress] }
          protocolo: { type: string }
          puerto_desde: { type: [integer, "null"] }
          puerto_hasta: { type: [integer, "null"] }
          cidr: { type: string }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"
    notas: >
      Una regla permisiva NO demuestra accesibilidad efectiva; solo afirma intencion de configuracion.

  - id: tf.versioning.config
    version: 1
    descripcion: >
      Versionado de almacenamiento declarado para un bucket.
    valor_schema:
      type: object
      required: [habilitado]
      properties:
        habilitado: { enum: [true, false, "unknown"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: doc.claim
    version: 1
    descripcion: >
      Afirmacion estructurada extraida por IA de un documento, con cita obligatoria (docs/02 §3.3).
    valor_schema:
      type: object
      required: [tipo_afirmacion, encontrado, confianza]
      properties:
        tipo_afirmacion: { type: string }
        contenido: { type: object }
        encontrado: { type: boolean }
        confianza: { type: number }
    modalidad_permitida: [documental]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: doc.source.info
    version: 1
    descripcion: >
      Marca de que un documento fue analizado (docs/05 §2.3 E6): cuantas secciones tenia y cuantas
      contesto la IA. No se emite si la IA no contesto ninguna (el documento no se leyo). Distingue "se analizo y no se encontro nada" de "no se analizo".
    valor_schema:
      type: object
      required: [titulo, archivo, secciones, analizadas, omitidas, sin_respuesta]
      properties:
        titulo: { type: string }
        archivo: { type: string }
        secciones: { type: integer }
        analizadas: { type: integer }
        omitidas: { type: integer }
        sin_respuesta: { type: integer }
    modalidad_permitida: [documental]
    requiere_locator: true
    estado: published
    publicado: "2026-10-02"
    notas: >
      `secciones: 0` indica un documento sin capa de texto extraible (PDF escaneado): se registro,
      pero no hay nada que analizar. `omitidas > 0`: el tope de secciones por documento dejo
      secciones sin enviar.

  - id: an.task.config
    version: 1
    descripcion: >
      Tarea declarativa de Ansible interpretada (docs/02 §3.2): lineinfile, copy, template, ufw,
      iptables.
    valor_schema:
      type: object
      required: [modulo, tarea, archivo]
      properties:
        modulo: { type: string }
        parametros: { type: object }
        tarea: { type: string }
        archivo: { type: string }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: an.playbook.present
    version: 1
    descripcion: >
      Deteccion de un playbook existente, con sus plays y hosts declarados (docs/02 §3.2).
    valor_schema:
      type: object
      required: [archivo]
      properties:
        archivo: { type: string }
        plays: { type: integer }
        hosts: { type: array, items: { type: string } }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: an.file.permissions
    version: 1
    descripcion: >
      Permisos declarados sobre un archivo sensible via el modulo `file` (docs/02 §3.2).
    valor_schema:
      type: object
      required: [ruta, modo]
      properties:
        ruta: { type: string }
        modo: { type: string }
        owner: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: an.service.state
    version: 1
    descripcion: >
      Estado declarado de un servicio via el modulo `service` (docs/02 §3.2).
    valor_schema:
      type: object
      required: [servicio, estado]
      properties:
        servicio: { type: string }
        estado: { enum: [habilitado, deshabilitado, desconocido] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: an.task.uninterpreted
    version: 1
    descripcion: >
      Tarea con modulo fuera del alcance declarado (command, shell, u otro no soportado) o
      condicional no evaluable (docs/02 §3.2). Es una limitacion, no un hallazgo de seguridad.
    valor_schema:
      type: object
      required: [tarea, motivo]
      properties:
        tarea: { type: string }
        motivo: { type: string }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: log.pattern
    version: 1
    descripcion: >
      Evidencia operativa agregada por ventana: un patron detectado (o su ausencia observable)
      sobre el stream de eventos de una organizacion/entorno (docs/02 §3.4, docs/06 §3).
    valor_schema:
      type: object
      required: [patron, resultado, desde, hasta, conteo]
      properties:
        patron: { type: string }
        resultado: { type: string }
        desde: { type: string }
        hasta: { type: string }
        conteo: { type: integer }
    modalidad_permitida: [operativa]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"
    notas: >
      Los logs son simulados (docs/02 §7): el valor esta en demostrar el flujo evento -> patron ->
      evidencia -> criterio, no en vigilar un sistema real.

  - id: log.window
    version: 1
    descripcion: >
      Completitud de la ventana de observacion usada para detectar patrones (docs/02 §3.4). Una
      ventana incompleta es la base de la "regla de justicia": sin ventana completa, la ausencia
      de un patron nunca se penaliza (docs/06 §5).
    valor_schema:
      type: object
      required: [desde, hasta, completo]
      properties:
        desde: { type: string }
        hasta: { type: string }
        completo: { type: boolean }
    modalidad_permitida: [operativa]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.expression.unresolved
    version: 1
    descripcion: >
      Limitacion explicita del parser: expresion que no se pudo resolver de forma determinista.
    valor_schema:
      type: object
      required: [recurso, atributo, expresion, motivo]
      properties:
        recurso: { type: string }
        atributo: { type: string }
        expresion: { type: string }
        motivo: { type: string }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"
