# Tipos de evidencia (docs/02-catalogo-de-evidencias.md). Una version publicada no se modifica jamas.
# v2: tf.db_exposure.config (accesibilidad publica de bases de datos, docs/02 §5).
# v3: doc.source.info (documento analizado, docs/05 §2.3 E6).
# v4: doc.claim@2 guarda la cita textual (docs/09 §60).
# v5: log.pattern@2 conserva los origenes del patron (`fuentes`), que hasta ahora se
#     calculaban y se descartaban al construir la evidencia (docs/09 §75).
# v6: tf.module.source y tf.provider.version: procedencia del codigo de terceros, leida de los
#     bloques `module` y `terraform { required_providers }` que el adaptador no miraba (docs/09 §90).
# v7: tf.identity.config: politica de contrasenas de la cuenta y exigencia de MFA leida del
#     documento de una politica IAM (docs/09 §91).
# v8: tf.resilience.config: alta disponibilidad (multi_az / replica) y capacidad elastica
#     (aws_autoscaling_group), para PR.IR-03 y PR.IR-04 (docs/09 §92).
version: 8
tipos:
  - id: tf.resource.present
    version: 1
    descripcion: >
      Inventario y existencia de un recurso de Terraform soportado por el adaptador.
    valor_schema:
      type: object
      required: [tipo, nombre]
      properties:
        tipo: { type: string }
        nombre: { type: string }
        entorno: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.encryption.config
    version: 1
    descripcion: >
      Configuracion de cifrado en reposo declarada para un recurso de almacenamiento o base de datos.
    valor_schema:
      type: object
      required: [estado]
      properties:
        estado: { enum: [enabled, disabled, unknown] }
        mecanismo: { type: [string, "null"] }
        llave: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"
    notas: >
      `unknown` nunca equivale a `disabled` ni a `enabled`; alimenta evidencia_insuficiente.

  - id: tf.public_access.config
    version: 1
    descripcion: >
      Bloqueo de acceso publico declarado para un bucket de almacenamiento (4 modos de S3).
    valor_schema:
      type: object
      required: [bloqueo_publico]
      properties:
        bloqueo_publico: { enum: [true, false, "unknown"] }
        nivel: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.db_exposure.config
    version: 1
    descripcion: >
      Accesibilidad publica declarada de una base de datos administrada (`publicly_accessible`).
    valor_schema:
      type: object
      required: [publico]
      properties:
        publico: { enum: [true, false, "unknown"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-10-02"
    notas: >
      Atributo ausente o expresion sin resolver => `unknown`; nunca se asume el default del
      proveedor (docs/02 §4).

  - id: tf.backup.config
    version: 1
    descripcion: >
      Retencion de backups declarada para una base de datos administrada.
    valor_schema:
      type: object
      properties:
        retencion_dias: { type: [integer, "null"] }
        habilitado: { type: [boolean, "null"] }
        ventana: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.logging.config
    version: 1
    descripcion: >
      Configuracion de CloudTrail declarada (habilitado, multi-region, destino).
    valor_schema:
      type: object
      properties:
        habilitado: { enum: [true, false, "unknown"] }
        multi_region: { type: [boolean, "null"] }
        destino: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.security_group.rules
    version: 1
    descripcion: >
      Reglas de ingress/egress declaradas en un security group, normalizadas por protocolo,
      rango de puertos y CIDR de origen/destino.
    valor_schema:
      type: array
      items:
        type: object
        required: [direccion, protocolo, puerto_desde, puerto_hasta, cidr]
        properties:
          direccion: { enum: [ingress, egress] }
          protocolo: { type: string }
          puerto_desde: { type: [integer, "null"] }
          puerto_hasta: { type: [integer, "null"] }
          cidr: { type: string }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"
    notas: >
      Una regla permisiva NO demuestra accesibilidad efectiva; solo afirma intencion de configuracion.

  - id: tf.versioning.config
    version: 1
    descripcion: >
      Versionado de almacenamiento declarado para un bucket.
    valor_schema:
      type: object
      required: [habilitado]
      properties:
        habilitado: { enum: [true, false, "unknown"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.resilience.config
    version: 1
    descripcion: >
      Mecanismo de resiliencia declarado para un recurso. `multi_az` y `replica` son alta
      disponibilidad (PR.IR-03); `autoescalado` es capacidad elastica (PR.IR-04), y su `habilitado`
      es cierto solo si `max_size > min_size`: un minimo igual al maximo es capacidad fija. Un
      `multi_az` ausente da `habilitado: null` y `estado: no_declarado`, no `false`: el defecto de
      AWS no se supone. `no_declarado` y no `unknown` a proposito: en este catalogo `unknown` esta
      reservado a un valor que el parser no pudo leer, y hace aparecer un hallazgo de limitacion.
      Un atributo que simplemente no esta escrito no es un valor ilegible.
    valor_schema:
      type: object
      required: [mecanismo, estado]
      properties:
        mecanismo: { enum: [multi_az, replica, autoescalado] }
        habilitado: { type: [boolean, "null"] }
        capacidad_minima: { type: [integer, "null"] }
        capacidad_maxima: { type: [integer, "null"] }
        estado: { enum: [declarado, no_declarado] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-10-29"

  - id: tf.identity.config
    version: 1
    descripcion: >
      Como se autentica la cuenta. `tipo: politica_de_contrasenas` trae los atributos de
      `aws_iam_account_password_policy`; `tipo: mfa` dice si el documento de una politica IAM exige
      la condicion `aws:MultiFactorAuthPresent`. En AWS no hay un atributo "exigir MFA", asi que es
      la unica lectura deterministica posible. Un documento no literal (`jsonencode`, un `data`
      source) da `estado: unknown`, nunca `mfa_requerido: false`.
    valor_schema:
      type: object
      required: [tipo, estado]
      properties:
        tipo: { enum: [politica_de_contrasenas, mfa] }
        longitud_minima: { type: [integer, "null"] }
        requiere_simbolos: { type: [boolean, "null"] }
        requiere_numeros: { type: [boolean, "null"] }
        rotacion_dias: { type: [integer, "null"] }
        reutilizacion_bloqueada: { type: [integer, "null"] }
        mfa_requerido: { type: [boolean, "null"] }
        estado: { enum: [declarado, "unknown"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-10-29"

  - id: tf.module.source
    version: 1
    descripcion: >
      Procedencia de un bloque `module`: de donde viene el codigo y si esa procedencia esta fijada
      a algo reproducible. `origen: local` es codigo del mismo repositorio, que no se adquiere y por
      tanto no se fija; el resto es de terceros. `fijada` es true con `version` (registry) o con un
      `?ref=<tag|sha>` en el `source` (git).
    valor_schema:
      type: object
      required: [nombre, origen, fijada, estado]
      properties:
        nombre: { type: string }
        source: { type: [string, "null"] }
        version: { type: [string, "null"] }
        origen: { enum: [registry, git, externo, local, desconocido] }
        fijada: { type: boolean }
        estado: { enum: [fijado, sin_fijar, propio, "unknown"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-10-29"

  - id: tf.provider.version
    version: 1
    descripcion: >
      Restriccion de version declarada para un proveedor en `terraform { required_providers }`.
      Un proveedor declarado sin `version` se emite con `restriccion: null`: declararlo sin fijarlo
      no es lo mismo que no declararlo.
    valor_schema:
      type: object
      required: [proveedor, fijada, estado]
      properties:
        proveedor: { type: string }
        restriccion: { type: [string, "null"] }
        fijada: { type: boolean }
        estado: { enum: [fijado, sin_fijar] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-10-29"

  - id: doc.claim
    version: 1
    descripcion: >
      Afirmacion estructurada extraida por IA de un documento, con cita obligatoria (docs/02 §3.3).
    valor_schema:
      type: object
      required: [tipo_afirmacion, encontrado, confianza]
      properties:
        tipo_afirmacion: { type: string }
        contenido: { type: object }
        encontrado: { type: boolean }
        confianza: { type: number }
    modalidad_permitida: [documental]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: doc.claim
    version: 2
    descripcion: >
      Afirmacion estructurada extraida por IA de un documento, con su cita textual. La cita se
      verifica contra el texto enviado: si no aparece, la afirmacion se guarda con una limitacion y
      no cuenta para puntuar (docs/05 §2.3 E8).
    valor_schema:
      type: object
      required: [tipo_afirmacion, encontrado, confianza]
      properties:
        tipo_afirmacion: { type: string }
        contenido: { type: object }
        encontrado: { type: boolean }
        confianza: { type: number }
        cita: { type: [string, "null"] }
    modalidad_permitida: [documental]
    requiere_locator: true
    estado: published
    publicado: "2026-10-02"
    notas: >
      v2 agrega `cita`. v1 queda para reproducir evaluaciones anteriores.

  - id: doc.source.info
    version: 1
    descripcion: >
      Marca de que un documento fue analizado (docs/05 §2.3 E6): cuantas secciones tenia y cuantas
      contesto la IA. No se emite si la IA no contesto ninguna (el documento no se leyo). Distingue "se analizo y no se encontro nada" de "no se analizo".
    valor_schema:
      type: object
      required: [titulo, archivo, secciones, analizadas, omitidas, sin_respuesta]
      properties:
        titulo: { type: string }
        archivo: { type: string }
        secciones: { type: integer }
        analizadas: { type: integer }
        omitidas: { type: integer }
        sin_respuesta: { type: integer }
    modalidad_permitida: [documental]
    requiere_locator: true
    estado: published
    publicado: "2026-10-02"
    notas: >
      `secciones: 0` indica un documento sin capa de texto extraible (PDF escaneado): se registro,
      pero no hay nada que analizar. `omitidas > 0`: el tope de secciones por documento dejo
      secciones sin enviar.

  - id: an.task.config
    version: 1
    descripcion: >
      Tarea declarativa de Ansible interpretada (docs/02 §3.2): lineinfile, copy, template, ufw,
      iptables.
    valor_schema:
      type: object
      required: [modulo, tarea, archivo]
      properties:
        modulo: { type: string }
        parametros: { type: object }
        tarea: { type: string }
        archivo: { type: string }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: an.playbook.present
    version: 1
    descripcion: >
      Deteccion de un playbook existente, con sus plays y hosts declarados (docs/02 §3.2).
    valor_schema:
      type: object
      required: [archivo]
      properties:
        archivo: { type: string }
        plays: { type: integer }
        hosts: { type: array, items: { type: string } }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: an.file.permissions
    version: 1
    descripcion: >
      Permisos declarados sobre un archivo sensible via el modulo `file` (docs/02 §3.2).
    valor_schema:
      type: object
      required: [ruta, modo]
      properties:
        ruta: { type: string }
        modo: { type: string }
        owner: { type: [string, "null"] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: an.service.state
    version: 1
    descripcion: >
      Estado declarado de un servicio via el modulo `service` (docs/02 §3.2).
    valor_schema:
      type: object
      required: [servicio, estado]
      properties:
        servicio: { type: string }
        estado: { enum: [habilitado, deshabilitado, desconocido] }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: an.task.uninterpreted
    version: 1
    descripcion: >
      Tarea con modulo fuera del alcance declarado (command, shell, u otro no soportado) o
      condicional no evaluable (docs/02 §3.2). Es una limitacion, no un hallazgo de seguridad.
    valor_schema:
      type: object
      required: [tarea, motivo]
      properties:
        tarea: { type: string }
        motivo: { type: string }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: log.pattern
    version: 1
    descripcion: >
      Evidencia operativa agregada por ventana: un patron detectado (o su ausencia observable)
      sobre el stream de eventos de una organizacion/entorno (docs/02 §3.4, docs/06 §3).
    valor_schema:
      type: object
      required: [patron, resultado, desde, hasta, conteo]
      properties:
        patron: { type: string }
        resultado: { type: string }
        desde: { type: string }
        hasta: { type: string }
        conteo: { type: integer }
    modalidad_permitida: [operativa]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"
    notas: >
      Los logs son simulados (docs/02 §7): el valor esta en demostrar el flujo evento -> patron ->
      evidencia -> criterio, no en vigilar un sistema real.

  - id: log.pattern
    version: 2
    descripcion: >
      Igual que la v1, mas los origenes de los eventos que forman el patron (`fuentes`). Sin ese
      campo el motor no puede distinguir "lo vieron dos sistemas distintos" de "lo vio uno solo",
      que es justo lo que pide DE.AE-03 (docs/02 §3.4, docs/06 §3).
    valor_schema:
      type: object
      required: [patron, resultado, desde, hasta, conteo]
      properties:
        patron: { type: string }
        resultado: { type: string }
        desde: { type: string }
        hasta: { type: string }
        conteo: { type: integer }
        fuentes: { type: array, items: { type: string } }
    modalidad_permitida: [operativa]
    requiere_locator: true
    estado: published
    publicado: "2026-10-24"
    notas: >
      `fuentes` sale de la `fuente` declarada por cada evento, o del archivo del que vino si no la
      declara (docs/06 §2). Una lista vacia significa que ningun evento del patron declaro origen,
      NO que haya un solo origen: la correlacion solo se afirma con dos o mas nombres distintos.
      v1 queda publicada para reproducir evaluaciones anteriores.

  - id: log.window
    version: 1
    descripcion: >
      Completitud de la ventana de observacion usada para detectar patrones (docs/02 §3.4). Una
      ventana incompleta es la base de la "regla de justicia": sin ventana completa, la ausencia
      de un patron nunca se penaliza (docs/06 §5).
    valor_schema:
      type: object
      required: [desde, hasta, completo]
      properties:
        desde: { type: string }
        hasta: { type: string }
        completo: { type: boolean }
    modalidad_permitida: [operativa]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"

  - id: tf.expression.unresolved
    version: 1
    descripcion: >
      Limitacion explicita del parser: expresion que no se pudo resolver de forma determinista.
    valor_schema:
      type: object
      required: [recurso, atributo, expresion, motivo]
      properties:
        recurso: { type: string }
        atributo: { type: string }
        expresion: { type: string }
        motivo: { type: string }
    modalidad_permitida: [declarada]
    requiere_locator: true
    estado: published
    publicado: "2026-09-30"
