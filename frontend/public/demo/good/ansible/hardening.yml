- hosts: servidores_app
  become: true
  tasks:
    - name: Deshabilitar login de root por SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'

    - name: Deshabilitar autenticacion por contrasena
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'

    - name: Permisos restrictivos en sshd_config
      file:
        path: /etc/ssh/sshd_config
        mode: "0600"
        owner: root

    - name: Habilitar rsyslog
      service:
        name: rsyslog
        state: started
        enabled: true

    - name: Copiar banner de acceso
      copy:
        src: files/banner.txt
        dest: /etc/issue.net
