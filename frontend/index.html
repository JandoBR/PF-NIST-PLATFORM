<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sin recursos externos a propósito: este prototipo se despliega en redes que pueden no tener
      salida a Internet, y un <link rel="stylesheet"> a Google Fonts es *render-blocking* -- si el
      navegador no lo alcanza, la página queda en blanco/"cargando" indefinidamente. Se usa la
      stack del sistema definida en tailwind.config.js (Inter/JetBrains Mono con fallback a
      ui-sans-serif / system-ui), que no requiere red. Tampoco se referencia un favicon externo.
    -->
    <title>NIST CSF 2.0 Security Maturity &amp; Recommendation Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
